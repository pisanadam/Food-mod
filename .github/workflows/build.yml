name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        target: ["26.1", "26.2", "26.3"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@v4

      - name: Check generated files are up to date
        run: |
          pip install pillow
          python3 tools/generate.py
          # PNG bytes can differ between Pillow versions, so only compare text files
          git diff --exit-code -- src tools/food_table.md ':!*.png'

      - name: Build and test for Minecraft ${{ matrix.target }}
        run: ./gradlew build -Ptarget=${{ matrix.target }}

      - uses: actions/upload-artifact@v4
        with:
          name: world-foods-mc${{ matrix.target }}
          path: build/libs/*.jar
