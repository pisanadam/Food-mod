name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        target: ["26.1", "26.2", "26.3"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@v4

      - name: Check generated files are up to date
        run: |
          pip install pillow
          python3 tools/generate.py
          # PNG bytes can differ between Pillow versions, so only compare text files
          git diff --exit-code -- src tools/food_table.md ':!*.png'

      - name: Build and test for Minecraft ${{ matrix.target }}
        run: ./gradlew build -Ptarget=${{ matrix.target }}

      - uses: actions/upload-artifact@v4
        with:
          name: world-foods-mc${{ matrix.target }}
          path: build/libs/*.jar

  # Starts a real Minecraft client (virtual display, software rendering) and runs the in-game tests:
  # crops grow, composting, eating with containers/effects, screenshots. Accepts the Minecraft EULA.
  client-gametest:
    strategy:
      fail-fast: false
      matrix:
        target: ["26.1", "26.2", "26.3"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@v4

      - name: Install virtual display and software graphics drivers
        run: sudo apt-get update && sudo apt-get install -y xvfb libegl1 libegl-mesa0 mesa-vulkan-drivers

      - name: Run in-game tests for Minecraft ${{ matrix.target }}
        run: xvfb-run -a -s "-screen 0 1280x720x24" ./gradlew runClientGameTest -PclientTests -Ptarget=${{ matrix.target }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots-mc${{ matrix.target }}
          path: build/run/clientGameTest/screenshots/
